[hooks.pre-commit.commands.pyrefly]
run = "pyrefly check packages/python"
workspace = true
files = "packages/python/**/*.py"

[hooks.pre-commit.commands.rubocop]
run = "bundle exec rubocop"
root = "packages/ruby"
workspace = true
files = "packages/ruby/**/*.rb"

[hooks.pre-commit.commands.steep]
run = "bundle exec steep check"
root = "packages/ruby"
workspace = true
files = "packages/ruby/**/*.rb"

[hooks.pre-commit.commands.golangci-lint]
run = "golangci-lint run ./..."
root = "packages/go"
workspace = true
files = "packages/go/**/*.go"

[hooks.pre-commit.commands.checkstyle]
run = "mvn -q checkstyle:check"
root = "packages/java"
workspace = true
files = "packages/java/**/*.java"

[hooks.pre-commit.commands.dart-analyze]
run = "dart analyze"
root = "packages/dart"
workspace = true
files = "packages/dart/**/*.dart"

[hooks.pre-commit.commands.credo]
run = "mix deps.get && mix credo --strict"
root = "packages/elixir"
workspace = true
files = "packages/elixir/**/*.{ex,exs}"

[hooks.pre-commit.commands.alef-snippets]
run = "alef snippets check --strict --cache off"
root = "."
workspace = true
files = "{alef.toml,fixtures/**/*.json,docs-site/src/snippets/generated/**}"

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate"]
