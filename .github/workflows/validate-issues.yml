name: Validate Issues

on:
  issues:
    types: [opened, edited]

# Matches the permissions reusable-validate-issues.yml declares. A called workflow's
# token is capped by the caller's, so these cannot be narrowed further without
# breaking issue labelling. ~keep
permissions:
  issues: write
  repository-projects: write

concurrency:
  group: validate-issues-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate-issues.yml@v1
    secrets: inherit
