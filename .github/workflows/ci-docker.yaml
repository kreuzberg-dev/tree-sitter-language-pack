name: CI Docker

on:
  push:
    branches: [main]
    paths:
      - "crates/ts-pack-core/**"
      - "crates/ts-pack-cli/**"
      - "sources/language_definitions.json"
      - "test_apps/cli/**"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/ci-docker.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "crates/ts-pack-core/**"
      - "crates/ts-pack-cli/**"
      - "sources/language_definitions.json"
      - "test_apps/cli/**"
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/ci-docker.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build Docker image & test all grammars
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Setup Node.js (for tree-sitter-cli)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install tree-sitter-cli
        run: npm install -g tree-sitter-cli@0.26.11

      - name: Clone grammar sources
        run: uv run --script scripts/clone_vendors.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ts-pack:test
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker,ignore-error=true

      - name: Verify image
        run: |
          docker run --rm ts-pack:test --version
          docker run --rm ts-pack:test --help | head -5

      - name: Check Docker image size
        uses: xberg-io/actions/check-docker-image-size@v1
        with:
          image: ts-pack:test
          warn-mb: "500"
          label: ts-pack

      # ~keep The image already compiles every grammar in the registry statically, so the
      # ~keep smoke test covers the whole set rather than the script's 8-language default.
      # ~keep The count comes from the registry so the step cannot drift from it again.
      - name: Get all language names
        id: langs
        uses: xberg-io/actions/list-language-definitions@v1

      - name: Test all grammars
        run: |
          docker run --rm \
            --user root \
            -e TS_PACK_LANGUAGES="${{ steps.langs.outputs.names }}" \
            -v "${{ github.workspace }}/test_apps:/tests" \
            --entrypoint "" \
            ts-pack:test \
            sh -c "apk add --no-cache python3 bash && TS_PACK_BIN=ts-pack bash /tests/cli/test_all_grammars.sh"

      - name: Test parse commands
        run: |
          echo "def hello(): pass" | docker run --rm -i ts-pack:test parse - --language python
          echo "fn main() {}" | docker run --rm -i ts-pack:test parse - --language rust
          echo '{"key": "value"}' | docker run --rm -i ts-pack:test parse - --language json

      - name: Test process command
        run: |
          echo "import os; def main(): pass" | docker run --rm -i ts-pack:test process - --language python --all | head -15

      - name: Extract binary for artifact
        run: |
          mkdir -p dist
          docker cp "$(docker create --name tmp ts-pack:test):/usr/local/bin/ts-pack" dist/ts-pack
          docker rm tmp
          cd dist && tar -czf ts-pack-linux-x86_64-musl.tar.gz ts-pack
          ls -lh ts-pack-linux-x86_64-musl.tar.gz
          file ts-pack

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts-pack-linux-x86_64-musl
          path: dist/ts-pack-linux-x86_64-musl.tar.gz
          retention-days: 14

      - name: Save Docker image
        run: |
          docker save ts-pack:test | gzip > dist/ts-pack-docker-image.tar.gz
          ls -lh dist/ts-pack-docker-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts-pack-docker-image
          path: dist/ts-pack-docker-image.tar.gz
          retention-days: 7
