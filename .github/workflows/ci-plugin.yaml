name: CI Plugin

# Freshness gate for the coding-agent plugin (lives in plugin/, generated by ai-rulez).
# Verifies the generated per-runtime bundles match plugin/.ai-rulez (BLAKE3 provenance)
# and that the plugin version tracks the core Cargo.toml version. Regenerate locally with
# `task plugin:generate`; re-sync the version with `task version:sync`.

on:
  push:
    branches: [main]
    paths:
      # Cargo.toml is the version source of truth the plugin must track. Without it
      # here a release commit — which bumps Cargo.toml and nothing under plugin/ —
      # does not trigger this workflow, so the version gate below never runs and the
      # plugin silently falls a release behind. That is how crawlberg's plugin/ sat at
      # 1.3.1 while its core shipped 1.3.2 and 1.3.3. ~keep
      - "Cargo.toml"
      - "plugin/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".ai-rulez/config.toml"
      - "scripts/sync_plugin_version.py"
      - ".task/version.yml"
      - ".github/workflows/ci-plugin.yaml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "plugin/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - ".ai-rulez/config.toml"
      - "scripts/sync_plugin_version.py"
      - ".task/version.yml"
      - ".github/workflows/ci-plugin.yaml"
  workflow_dispatch:

concurrency:
  group: ci-plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-freshness:
    name: Plugin bundle freshness
    if: github.repository == 'xberg-io/tree-sitter-language-pack' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Pinned to the ai-rulez version that generated the committed bundles;
      # bump in lockstep. ~keep
      - name: Verify plugin bundles and version
        uses: xberg-io/actions/verify-ai-rulez-plugin@v1
        with:
          ai-rulez-version: "4.11.0"
