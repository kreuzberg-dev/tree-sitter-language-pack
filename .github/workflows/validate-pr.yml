name: Validate PR

on:
  pull_request:
    types: [opened, edited, synchronize]

# Matches the permissions reusable-validate-pr.yml declares. ~keep
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate-pr.yml@v1
    secrets: inherit
